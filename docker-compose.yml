version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./gateway:/app
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./worker
    env_file: .env
    volumes:
      - ./worker:/app
    depends_on:
      - redis
    # restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  redis_data:
