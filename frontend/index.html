<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video To Text | AI Extractor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <!-- Header -->
        <header class="text-center mb-4">
            <h1 data-i18n="title">Video To Text</h1>
            <p data-i18n="subtitle">Extract transcripts & metadata from YouTube, TikTok, Instagram.</p>
        </header>

        <!-- Input Section -->
        <section class="card">
            <div class="flex-row">
                <input type="text" id="url-input" class="input" data-i18n-placeholder="placeholder_url" placeholder="Paste video URL here..." autofocus>
                <button id="add-btn" class="btn btn-primary" data-i18n="btn_add">Add</button>
            </div>
        </section>

        <!-- Cart Section -->
        <section class="card">
            <div class="flex-row" style="justify-content: space-between; align-items: baseline;">
                <h2 data-i18n="cart_title">Your Cart</h2>
                <span id="cart-count">0 items</span>
            </div>
            <div id="cart-list" class="mt-4">
                <!-- Cart items will be injected here by app.js -->
                <p style="opacity: 0.6;" data-i18n="cart_empty">Your cart is currently empty.</p>
            </div>
        </section>

        <!-- Checkout Section -->
        <section class="card text-right">
            <div class="mt-4 text-right">
                <h3 data-i18n="total">Total</h3>
                <p id="total-price" style="font-size: 2rem; font-weight: 900;">$0.00</p>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                    <button id="checkout-btn" class="btn btn-primary" data-i18n="btn_checkout">Pay with Stripe</button>
                    <button id="dev-pay-btn" class="btn" style="background-color: #333; color: #fff;">⚡ Dev Pay</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
